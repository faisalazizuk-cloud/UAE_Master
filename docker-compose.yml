version: "3.8"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./tradetracker.db
      - SECRET_KEY=${SECRET_KEY:-tradetracker-secret-change-me}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - SEC_EDGAR_USER_AGENT=${SEC_EDGAR_USER_AGENT:-TradeTracker admin@tradetracker.local}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tradetracker.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-tradetracker-nextauth-secret-change-me}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
